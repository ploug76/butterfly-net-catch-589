<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4caf50"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Butterfly Net">
<title>Butterfly Net Catch</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d3b22;touch-action:none;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%}
.tb{position:fixed;top:calc(6px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:19px;display:none;z-index:3;padding:0;background:rgba(20,40,20,.55);touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
#pause{right:calc(6px + env(safe-area-inset-right))}#mute{right:calc(54px + env(safe-area-inset-right))}#help{right:calc(102px + env(safe-area-inset-right))}
#panel{position:fixed;inset:0;display:none;z-index:6;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
#pbox{background:#fffdf3;border:5px solid #4caf50;border-radius:18px;width:min(90vw,480px);max-height:80vh;overflow:auto;padding:12px 16px;color:#223;font-size:15px;line-height:1.4;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#pbox h2{margin:4px 0 8px;text-align:center;color:#2e7d32}#pbox h3{margin:10px 0 4px;color:#6a1b9a}#pbox ul{padding-left:20px;margin:4px 0}
#pclose{display:block;margin:12px auto 2px;font-size:18px;font-weight:bold;font-family:inherit;padding:8px 26px;border-radius:24px;border:3px solid #fff;background:#4caf50;color:#fff;cursor:pointer}
</style></head><body>
<canvas id="c"></canvas>
<button id="pause" class="tb" aria-label="Pause">⏸</button><button id="mute" class="tb" aria-label="Sound on or off">🔊</button><button id="help" class="tb" aria-label="How to play">❓</button>
<div id="panel"><div id="pbox"><div id="ptext"></div><button id="pclose">OK!</button></div></div>
<script>
'use strict';
%GAME%
</script>
</body></html>
